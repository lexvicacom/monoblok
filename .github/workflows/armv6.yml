name: ARMv6 (Raspberry Pi Zero W)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/armv6.yml'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'vendor/**'
      - 'test/**'
  push:
    branches: [ci/armv6-pi-zero]

jobs:
  armv6:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Enable ARMv6 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Build and test inside ARMv6 Raspberry Pi OS-compatible userspace
        run: |
          docker run --rm --platform linux/arm/v6 \
            -v "$PWD:/work" -w /work \
            balenalib/raspberry-pi-debian:bookworm-build \
            bash -euc '
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential cmake pkg-config libssl-dev ca-certificates file
              cmake -S . -B build-armv6 -DCMAKE_BUILD_TYPE=Release
              cmake --build build-armv6 --parallel 2
              MB_TEST_EMULATED=1 ctest --test-dir build-armv6 --output-on-failure
              file build-armv6/monoblok
              readelf -h build-armv6/monoblok
              ldd build-armv6/monoblok
              build-armv6/monoblok --version
            '

      - name: Upload ARMv6 binary for Pi Zero W testing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: monoblok-linux-armv6-gnueabihf
          path: build-armv6/monoblok
          if-no-files-found: error
