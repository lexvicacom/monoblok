name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
          - platform: linux-aarch64
            runs-on: ubuntu-22.04-arm
          - platform: macos-aarch64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        run: |
          set -eu
          ref="${GITHUB_REF##*/}"
          case "$ref" in
            v*) v="$ref" ;;
            *)  v="$(git rev-parse --short HEAD)" ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build + package
        run: bash scripts/package.sh "${{ steps.ver.outputs.version }}" "${{ matrix.platform }}"

      - name: Resolve container metadata
        if: startsWith(matrix.platform, 'linux-')
        id: image
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          case "${{ matrix.platform }}" in
            linux-x86_64)
              echo "platform=linux/amd64" >> "$GITHUB_OUTPUT"
              echo "arch=amd64" >> "$GITHUB_OUTPUT"
              ;;
            linux-aarch64)
              echo "platform=linux/arm64" >> "$GITHUB_OUTPUT"
              echo "arch=arm64" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unexpected Linux platform: ${{ matrix.platform }}" >&2
              exit 2
              ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Check runtime dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: ldd build-package/monoblok

      - name: Set up Docker Buildx
        if: startsWith(matrix.platform, 'linux-')
        uses: docker/setup-buildx-action@v3

      - name: Smoke container image
        if: startsWith(matrix.platform, 'linux-')
        run: |
          set -eu
          docker build --build-arg MONOBLOK_BIN=build-package/monoblok -t monoblok:release-smoke .
          docker run --rm monoblok:release-smoke --version

      - name: Log in to GHCR
        if: startsWith(matrix.platform, 'linux-')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push container image
        if: startsWith(matrix.platform, 'linux-')
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          platforms: ${{ steps.image.outputs.platform }}
          push: true
          build-args: |
            MONOBLOK_BIN=build-package/monoblok
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.ver.outputs.version }}-${{ steps.image.outputs.arch }}
            ${{ steps.image.outputs.image }}:${{ github.sha }}-${{ steps.image.outputs.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-manifest:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      packages: write
    steps:
      - name: Resolve version
        id: ver
        run: |
          set -eu
          ref="${GITHUB_REF##*/}"
          case "$ref" in
            v*) v="$ref" ;;
            *)  v="${GITHUB_SHA::7}" ;;
          esac
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch container tag
        run: |
          set -eu
          image="${{ steps.ver.outputs.image }}"
          version="${{ steps.ver.outputs.version }}"
          docker buildx imagetools create \
            -t "$image:$version" \
            -t "$image:${GITHUB_SHA}" \
            "$image:$version-amd64" \
            "$image:$version-arm64"

      - name: Move latest tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          image="${{ steps.ver.outputs.image }}"
          version="${{ steps.ver.outputs.version }}"
          docker buildx imagetools create \
            -t "$image:latest" \
            "$image:$version-amd64" \
            "$image:$version-arm64"

  update-start-script:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update start script release tag
        run: |
          set -eu
          git pull --ff-only origin main
          perl -0pi -e 's/^VERSION=.*/VERSION=$ENV{GITHUB_REF_NAME}/m' scripts/start.sh
          if git diff --quiet -- scripts/start.sh; then
            echo "scripts/start.sh already points at ${GITHUB_REF_NAME}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/start.sh
          git commit -m "chore: update start script for ${GITHUB_REF_NAME} [skip ci]"
          git push origin HEAD:main
