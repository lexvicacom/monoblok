name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run tests
        run: zig build test --summary all

      - name: Cross-compile dist artifacts
        run: zig build dist

      - name: Package artifacts
        run: |
          set -eu
          ref="${GITHUB_REF##*/}"
          case "$ref" in
            v*) version="$ref" ;;
            *)  version="$(git rev-parse --short HEAD)" ;;
          esac
          cd dist
          for d in */; do
            triple="${d%/}"
            case "$triple" in
              x86_64-linux-musl)   pretty="linux-x86_64" ;;
              aarch64-linux-musl)  pretty="linux-aarch64" ;;
              x86_64-windows-gnu)  pretty="windows-x86_64" ;;
              aarch64-windows-gnu) pretty="windows-aarch64" ;;
              *)                   pretty="$triple" ;;
            esac
            name="monoblok-${version}-${pretty}"
            mv "$triple" "$name"
            case "$pretty" in
              windows-*) zip -r "${name}.zip" "$name" ;;
              *)         tar -czf "${name}.tar.gz" "$name" ;;
            esac
          done
          ls -la

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build (aarch64-macos, ReleaseSafe)
        run: |
          set -eu
          triple="aarch64-macos"
          out="dist/${triple}"
          mkdir -p "$out"
          zig build -Dtarget="$triple" -Doptimize=ReleaseSafe
          cp zig-out/bin/monoblok "$out/"
          cp patchbay.edn "$out/"
          cp scripts/bench.sh "$out/"

      - name: Package artifact
        run: |
          set -eu
          ref="${GITHUB_REF##*/}"
          case "$ref" in
            v*) version="$ref" ;;
            *)  version="$(git rev-parse --short HEAD)" ;;
          esac
          cd dist
          name="monoblok-${version}-macos-aarch64"
          mv "aarch64-macos" "$name"
          zip -r "${name}.zip" "$name"
          ls -la

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
