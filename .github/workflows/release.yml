name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: Run tests
        run: zig build test --summary all

  build:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
          - platform: linux-aarch64
            runs-on: ubuntu-22.04-arm
          - platform: macos-aarch64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Resolve version
        id: ver
        run: |
          set -eu
          ref="${GITHUB_REF##*/}"
          case "$ref" in
            v*) v="$ref" ;;
            *)  v="$(git rev-parse --short HEAD)" ;;
          esac
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build + package
        run: |
          set -eu
          bash scripts/package.sh "${{ steps.ver.outputs.version }}" "${{ matrix.platform }}"
          case "${{ matrix.platform }}" in
            linux-*) bash scripts/package.sh "${{ steps.ver.outputs.version }}" "${{ matrix.platform }}" epoll ;;
          esac

      - name: Resolve container metadata
        if: startsWith(matrix.platform, 'linux-')
        id: image
        run: |
          set -eu
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          case "${{ matrix.platform }}" in
            linux-x86_64)
              echo "platform=linux/amd64" >> "$GITHUB_OUTPUT"
              echo "arch=amd64" >> "$GITHUB_OUTPUT"
              ;;
            linux-aarch64)
              echo "platform=linux/arm64" >> "$GITHUB_OUTPUT"
              echo "arch=arm64" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "unexpected Linux platform: ${{ matrix.platform }}" >&2
              exit 2
              ;;
          esac
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        if: startsWith(matrix.platform, 'linux-')
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: startsWith(matrix.platform, 'linux-')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push container image
        if: startsWith(matrix.platform, 'linux-')
        uses: docker/build-push-action@v6
        with:
          context: ${{ github.workspace }}
          platforms: ${{ steps.image.outputs.platform }}
          push: true
          tags: |
            ${{ steps.image.outputs.image }}:${{ steps.ver.outputs.version }}-${{ steps.image.outputs.arch }}
            ${{ steps.image.outputs.image }}:${{ github.sha }}-${{ steps.image.outputs.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: false
          prerelease: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  container-manifest:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      packages: write
    steps:
      - name: Resolve version
        id: ver
        run: |
          set -eu
          ref="${GITHUB_REF##*/}"
          case "$ref" in
            v*) v="$ref" ;;
            *)  v="${GITHUB_SHA::7}" ;;
          esac
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch container tag
        run: |
          set -eu
          image="${{ steps.ver.outputs.image }}"
          version="${{ steps.ver.outputs.version }}"
          docker buildx imagetools create \
            -t "$image:$version" \
            -t "$image:${GITHUB_SHA}" \
            "$image:$version-amd64" \
            "$image:$version-arm64"

      - name: Move latest tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          image="${{ steps.ver.outputs.image }}"
          version="${{ steps.ver.outputs.version }}"
          docker buildx imagetools create \
            -t "$image:latest" \
            "$image:$version-amd64" \
            "$image:$version-arm64"
