name: Release

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Run tests
        run: zig build test --summary all

      - name: Cross-compile dist artifacts
        run: zig build dist

      - name: Package artifacts
        run: |
          set -eu
          cd dist
          for d in */; do
            triple="${d%/}"
            case "$triple" in
              *windows*) zip -r "monoblok-${triple}.zip" "$triple" ;;
              *)         tar -czf "monoblok-${triple}.tar.gz" "$triple" ;;
            esac
          done
          ls -la

      - name: Upload artifact bundle
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
