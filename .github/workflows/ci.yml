name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags-ignore:
      - '**'
    paths-ignore:
      - '**/*.md'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runs-on: ubuntu-22.04
          - platform: linux-aarch64
            runs-on: ubuntu-22.04-arm
          - platform: macos-aarch64
            runs-on: macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  test-asan:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install sanitizer dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure ASan/UBSan
        run: cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DMB_ASAN=ON
      - name: Build ASan/UBSan
        run: cmake --build build-asan --parallel
      - name: Test ASan/UBSan
        run: ctest --test-dir build-asan --output-on-failure
      - name: Load soak ASan/LeakSanitizer
        run: cmake --build build-asan --target load-soak --parallel
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1

  coverage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install coverage dependencies
        run: sudo apt-get update && sudo apt-get install -y gcovr libssl-dev netcat-openbsd
      - name: Configure coverage
        run: >
          CC=gcc cmake -S . -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS_DEBUG="--coverage -O0 -g"
          -DCMAKE_EXE_LINKER_FLAGS="--coverage"
      - name: Build coverage
        run: cmake --build build-coverage --parallel
      - name: Test coverage
        run: ctest --test-dir build-coverage --output-on-failure
      - name: Smoke coverage
        run: cmake --build build-coverage --target smoke --parallel
      - name: Generate coverage report
        run: >
          gcovr -r .
          --exclude 'vendor/.*'
          --html --html-details
          -o build-coverage/coverage.html
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build-coverage/coverage*

  smoke:
    needs:
      - test
      - test-asan
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install smoke dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev netcat-openbsd
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Server smoke
        run: cmake --build build --target smoke --parallel
